      - _pages/kontakt.md
    profiles: true

exclude:
  - Gemfile
  - Gemfile.lock
  - CNAME
  - Dockerfile
  - docker-compose.yml

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap

theme_color: "#1d428a"
