  - title: "Nauka"
    pages:
      - _pages/oferta.md
      - _pages/warsztaty.md
      - _pages/cennik.md
  - title: "Szkoła"
    pages:
      - _pages/kadra.md
      - _pages/blog.md
      - _pages/standardy-ochrony.md
      - _pages/polityka-plikow-cookies.md
  - title: "Znajdź nas"
